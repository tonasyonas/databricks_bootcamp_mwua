resources:
  pipelines:
    # UC1: Customer Billing
    billing_pipeline:
      name: "Customer Billing Pipeline - ${var.environment}"
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      channel: CURRENT
      configuration:
        volume_base_path: ${var.volume_base_path}
        target_catalog: ${var.catalog}
      libraries:
        # Glob the whole billing folder so all dataset files AND the shared
        # _billing_consumption_hard_rules.py helper deploy under one source
        # root — this is what makes `from _billing_consumption_hard_rules
        # import valid_billing_row` resolve at runtime, and it auto-includes
        # the new quarantine + dq tables without listing each file by hand.
        - glob:
            include: ../src/billing/**
      tags:
        team: team2
        domain: billing

    # UC2: Finance & Contractors
    finance_contractors_pipeline:
      name: "Finance & Contractors Pipeline - ${var.environment}"
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      channel: CURRENT
      configuration:
        volume_base_path: ${var.volume_base_path}
      libraries:
        - glob:
            include: ../src/finance/**
        - glob:
            include: ../src/contractors/**
      tags:
        team: team2
        domain: finance

    # UC3: Network Telemetry
    network_pipeline:
      name: "Network Telemetry Pipeline - ${var.environment}"
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      channel: CURRENT
      configuration:
        volume_base_path: ${var.volume_base_path}
        zone_confidence_threshold: "80"
        target_catalog: ${var.catalog}
      libraries:
        # Glob the whole network folder so all dataset files AND the shared
        # _network_telemetry_hard_rules.py helper deploy under one source root
        # — this makes `from _network_telemetry_hard_rules import
        # valid_network_reading` resolve at runtime, and auto-includes the new
        # quarantine + dq tables without listing each file by hand.
        - glob:
            include: ../src/network/**
      tags:
        team: team2
        domain: network

    # Integration: Cross-cutting zone performance
    integration_pipeline:
      name: "Integration Pipeline - Zone Performance - ${var.environment}"
      catalog: ${var.catalog}
      schema: gold
      serverless: true
      channel: CURRENT
      configuration:
        target_catalog: ${var.catalog}
      libraries:
        - glob:
            include: ../src/intergration/**
      tags:
        team: team2
        domain: integration
