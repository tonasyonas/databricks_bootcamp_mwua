resources:
  jobs:
    # Billing + Finance/Contractors + Integration — daily batch, matches
    # billing cycles and invoice/work-order export frequency
    mwua_daily_refresh:
      name: "MWUA Daily Refresh - ${var.environment}"
      tags:
        team: team2
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"  # Daily at 6am SGT
        timezone_id: Asia/Singapore
      tasks:
        - task_key: uc1_billing
          pipeline_task:
            pipeline_id: ${resources.pipelines.billing_pipeline.id}
            full_refresh: false

        - task_key: uc2_finance_contractors
          pipeline_task:
            pipeline_id: ${resources.pipelines.finance_contractors_pipeline.id}
            full_refresh: false

        # Depends only on uc1 + uc2 as tasks. Network is NOT a task
        # dependency here — it runs on its own faster schedule (below),
        # so by 6am its Gold tables are already fresh within ~15 min.
        # Integration reads that latest state rather than waiting on a
        # same-run network task — deliberate eventual consistency, not
        # an oversight.
        - task_key: integration_zone_performance
          depends_on:
            - task_key: uc1_billing
            - task_key: uc2_finance_contractors
          pipeline_task:
            pipeline_id: ${resources.pipelines.integration_pipeline.id}
            full_refresh: false
      email_notifications:
        on_failure:
          - anita.koo@ncs.com.sg
          - jonas.tua@ncs.com.sg
        on_duration_warning_threshold_exceeded:
          - anita.koo@ncs.com.sg
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 1800

    # Network Telemetry — 15-minute cadence, sized against dim_zone's
    # own sla_response_hours (4-6 hrs), comfortable margin without
    # paying for always-on continuous compute
    network_pipeline_refresh:
      name: "Network Telemetry Refresh - ${var.environment}"
      tags:
        team: team2
        domain: network
      schedule:
        quartz_cron_expression: "0 */15 * * * ?"
        timezone_id: Asia/Singapore
      tasks:
        - task_key: uc3_network
          pipeline_task:
            pipeline_id: ${resources.pipelines.network_pipeline.id}
            full_refresh: false
      email_notifications:
        on_failure:
          - anita.koo@ncs.com.sg
          - jonas.tua@ncs.com.sg

    dim_zone_setup:
      name: "dim_zone Setup - ${var.environment}"
      tags:
        team: team2
      tasks:
        - task_key: setup_dim_zone
          notebook_task:
            notebook_path: ../setup/00_dim_zone_setup.py
            base_parameters:
              target_catalog: ${var.catalog}