bundle:
  name: customer-billing-pipeline

variables:
  catalog:
    description: Target Unity Catalog catalog for pipeline output
    default: dev_mwua_catalog_team2
  source_volume_path:
    description: Volume path for raw billing customer data
    default: /Volumes/prd_mwua_capstone_team2/landing/raw/billing_customer/

resources:
  pipelines:
    customer_billing:
      name: "Customer Billing Pipeline - ${bundle.target}"
      catalog: ${var.catalog}
      schema: default
      photon: true
      serverless: true
      channel: CURRENT
      libraries:
        - glob:
            include: ./notebooks/uc1_billing/bronze/**
        - glob:
            include: ./notebooks/uc1_billing/silver/**
        - glob:
            include: ./notebooks/uc1_billing/gold/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-d8b9acd9-b19b.cloud.databricks.com
    variables:
      catalog: dev_mwua_catalog_team2

  prod:
    mode: production
    workspace:
      host: https://dbc-d8b9acd9-b19b.cloud.databricks.com
    variables:
      catalog: prd_mwua_capstone_team2
    git:
      branch: main
    permissions:
      - group_name: users
        level: CAN_VIEW
