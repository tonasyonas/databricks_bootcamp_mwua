bundle:
  name: mwua-capstone

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for pipeline output
    default: dev_mwua_catalog_team2
  environment:
    description: Environment name (dev/prod) used in pipeline and job display names
    default: Dev
  volume_base_path:
    description: Base Unity Catalog volume path for raw source files
    default: /Volumes/prd_mwua_capstone_team2/landing/raw

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-d8b9acd9-b19b.cloud.databricks.com
    variables:
      catalog: dev_mwua_catalog_team2
      environment: Dev
      volume_base_path: /Volumes/prd_mwua_capstone_team2/landing/raw

  prod:
    mode: production
    workspace:
      host: https://dbc-d8b9acd9-b19b.cloud.databricks.com
    variables:
      catalog: prd_mwua_capstone_team2
      environment: Prod
      volume_base_path: /Volumes/prd_mwua_capstone_team2/landing/raw
    git:
      branch: main
    permissions:
      - group_name: users
        level: CAN_VIEW
